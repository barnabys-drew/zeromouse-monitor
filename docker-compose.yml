services:
  monitor:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    environment:
      - NTFY_TOPIC=${NTFY_TOPIC:?Set NTFY_TOPIC in .env — copy from .env.example}
      - NTFY_SERVER=${NTFY_SERVER:-https://ntfy.sh}
      - CHECK_INTERVAL=${CHECK_INTERVAL:-900}
      - STATE_FILE=${STATE_FILE:-data/.zeromouse_state.json}
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('https://zeromouse.co/products/blade.json', timeout=10).raise_for_status()"]
      interval: 30m
      timeout: 15s
      retries: 3
      start_period: 60s
